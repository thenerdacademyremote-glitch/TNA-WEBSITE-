<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<script>
  /* On GitHub Pages this page is served for any missing URL, at any depth. Once [SITE_URL] is replaced,
     this makes the links, fonts and icons below resolve from the site root. */
  (function(){ var SITE_URL="[SITE_URL]"; if(/^https?:\/\//.test(SITE_URL)) document.write('<base href="'+SITE_URL.replace(/\/$/,"")+'/">'); })();
</script>
<title>Página no encontrada · The Nerd Academy</title>
<meta name="description" content="Esta página no existe. Vuelve al inicio de The Nerd Academy.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-style:normal;font-weight:900;font-display:swap;src:url(fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/spectral-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Spectral";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/spectral-latin-400-italic.woff2) format("woff2")}
:root{--dsp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--ser:"Spectral",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#EFE6D2}
body{font-family:var(--ser);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid #B3121E;outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px;width:100%}
.head{border-bottom:1px solid #342C28}
.head .wrap{display:flex;align-items:center;height:76px}
.lockup{display:flex;align-items:center;gap:10px;text-decoration:none;color:#EFE6D2}
.lockup svg{width:48px;height:48px}
.lockup span{font-family:var(--dsp);font-weight:800;font-size:21px;letter-spacing:.08em;text-transform:uppercase;line-height:1}
main{position:relative;flex:1;display:flex;align-items:center;overflow:hidden}
.slab{position:absolute;top:0;bottom:0;right:0;width:52%;background-color:#B3121E;background-image:radial-gradient(circle,rgba(0,0,0,.35) 1.5px,transparent 1.8px);background-size:7px 7px;clip-path:polygon(38% 0,72% 0,46% 100%,12% 100%)}
.in{position:relative;padding-top:80px;padding-bottom:96px;display:grid;gap:22px;justify-items:start;max-width:640px}
.kicker{font-family:var(--dsp);font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#EFE6D2}
.kicker b{color:#B3121E;font-weight:800}
h1{margin:0;font-family:var(--dsp);font-weight:900;text-transform:uppercase;font-size:clamp(48px,8vw,104px);line-height:.88}
p{margin:0;font-size:clamp(18px,1.8vw,22px);max-width:36ch;color:#E7DCC5}
.en{font-style:italic;color:#A39886;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:14px 24px;font-family:var(--dsp);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;line-height:1;border:2px solid #000;background:#B3121E;color:#EFE6D2;box-shadow:4px 4px 0 #EFE6D2;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:#7E0A13;transform:translate(-1px,-1px);box-shadow:5px 5px 0 #EFE6D2}
.glasses{width:150px;color:#EFE6D2}
.head .wrap{justify-content:space-between;gap:16px}
.lang{display:inline-flex;border:2px solid #EFE6D2;flex:none}
.lang button{border:0;background:transparent;color:#EFE6D2;font-family:var(--dsp);font-weight:800;letter-spacing:.08em;font-size:15px;min-width:44px;min-height:36px;padding:0 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#EFE6D2;color:#000}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .slab{width:100%;top:auto;height:24%;clip-path:polygon(40% 0,80% 0,60% 100%,20% 100%)}
  .lockup svg{width:38px;height:38px}
  .lockup span{font-size:14px;max-width:92px;line-height:1.05}
  .lang button{min-width:40px;min-height:40px;padding:0 8px;font-size:14px}
  .in{padding-top:48px;padding-bottom:180px}
  .btn{width:100%}
}
</style>
</head>
<body>
<header class="head">
  <div class="wrap">
    <a class="lockup" href="./" aria-label="The Nerd Academy, inicio" data-en-label="The Nerd Academy, home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(2.4 0)" fill="none" stroke-linecap="round"><circle cx="18" cy="32" r="11" stroke="currentColor" stroke-width="4.4"></circle><circle cx="46" cy="32" r="11" stroke="currentColor" stroke-width="4.4"></circle><path d="M29.2 30.6Q32 27.6 34.8 30.6" stroke="currentColor" stroke-width="3.6"></path><path d="M7 29.5L1.5 33M57 29.5L52 21.5" stroke="currentColor" stroke-width="3.6"></path><path d="M12.2 29.2A6.4 6.4 0 0 1 16.6 25.4M40.2 29.2A6.4 6.4 0 0 1 44.6 25.4" stroke="#B3121E" stroke-width="2.8"></path></g></svg>
      <span>The Nerd Academy</span>
    </a>
    <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
  </div>
</header>
<main>
  <div class="slab" aria-hidden="true"></div>
  <div class="wrap">
    <div class="in">
      <svg class="glasses" viewBox="0 15 66 34" aria-hidden="true"><g transform="translate(2.4 0)" fill="none" stroke-linecap="round"><circle cx="18" cy="32" r="11" stroke="currentColor" stroke-width="4.4"></circle><circle cx="46" cy="32" r="11" stroke="currentColor" stroke-width="4.4"></circle><path d="M29.2 30.6Q32 27.6 34.8 30.6" stroke="currentColor" stroke-width="3.6"></path><path d="M7 29.5L1.5 33M57 29.5L52 21.5" stroke="currentColor" stroke-width="3.6"></path><path d="M12.2 29.2A6.4 6.4 0 0 1 16.6 25.4M40.2 29.2A6.4 6.4 0 0 1 44.6 25.4" stroke="#B3121E" stroke-width="2.8"></path></g></svg>
      <span class="kicker">Error <b>404</b></span>
      <h1 data-en="This page doesn't exist.">Esta página no existe.</h1>
      <p data-en="The link may be mistyped, or the page may have moved. Your superpower is still waiting for you on the home page.">Puede que el enlace esté mal escrito o que la página se haya movido. Tu superpoder sigue esperándote en el inicio.</p>
      <a class="btn" href="./" data-en="Back to home">Volver al inicio</a>
    </div>
  </div>
</main>
<script>
  /* ES/EN switch, sharing the visitor's saved choice with the rest of the site. */
  (function(){
    var T={es:"Página no encontrada · The Nerd Academy",en:"Page not found · The Nerd Academy"};
    function apply(l){
      document.documentElement.lang=l;
      document.querySelectorAll("[data-en]").forEach(function(e){ if(e.dataset.es===undefined) e.dataset.es=e.textContent; e.textContent= l==="en" ? e.dataset.en : e.dataset.es; });
      document.querySelectorAll("[data-en-label]").forEach(function(e){ if(e.dataset.esLabel===undefined) e.dataset.esLabel=e.getAttribute("aria-label"); e.setAttribute("aria-label", l==="en" ? e.dataset.enLabel : e.dataset.esLabel); });
      document.querySelectorAll(".lang button").forEach(function(b){ b.setAttribute("aria-pressed",String(b.dataset.lang===l)); });
      document.title=T[l];
      try{ localStorage.setItem("tna-lang",l); }catch(x){}
    }
    document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click",function(){ apply(b.dataset.lang); }); });
    var saved=null; try{ saved=localStorage.getItem("tna-lang"); }catch(x){}
    if(saved==="en") apply("en");
  })();
</script>
</body>
</html>
